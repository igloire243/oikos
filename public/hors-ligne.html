<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Hors ligne — Oikos Console</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
               font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; color: #0f172a; }
        main { max-width: 26rem; text-align: center; }
        .icone { width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 20px; display: block; }
        h1 { font-size: 1.35rem; margin: 0 0 8px; }
        p { margin: 0 0 12px; line-height: 1.55; color: #475569; }
        button { margin-top: 8px; min-height: 44px; padding: 0 22px; border: 0; border-radius: 12px;
                 background: #128C7E; color: #fff; font-size: 1rem; font-weight: 600; }
    </style>
</head>
<body>
    <main>
        <img class="icone" src="/icons/icon-192.png" alt="">
        <h1>Vous êtes hors ligne</h1>
        <p>La console n'affiche jamais une copie ancienne : un client, une clé de licence ou un montant doivent être ceux d'aujourd'hui.</p>
        <p>Reconnectez-vous, puis réessayez.</p>
        <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
</body>
</html>
